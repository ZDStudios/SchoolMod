  <title id="t">SchoolMod logo</title>
  <!-- Catppuccin Mocha: surface0 #313244, surface1 #45475a, green #a6e3a1, teal #94e2d5, sky #89dceb, sapphire #74c7ec, blue #89b4fa, lavender #b4befe, text #cdd6f4 -->
  <defs>
    <linearGradient id="teal-blue" x1="40" y1="800" x2="530" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#94e2d5"/>
      <stop offset="1" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="868" y1="560" x2="300" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#89b4fa"/>
      <stop offset="1" stop-color="#74c7ec"/>
