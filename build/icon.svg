      <stop offset="0" stop-color="#585b70"/>
      <stop offset="1" stop-color="#45475a"/>
    </linearGradient>
    <clipPath id="shield"><path d="M40 345L455 237L868 345V852L455 1075L40 845Z"/></clipPath>
  </defs>

