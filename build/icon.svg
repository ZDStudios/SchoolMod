    <!-- darker teal facet -->
    <path d="M40 530L95 572L340 795L40 738Z" fill="#94e2d5" fill-opacity=".55"/>
    <!-- deep corner (runs under the swoosh so no seam shows) -->
    <path d="M290 975L868 670V852L455 1075L40 845Z" fill="url(#deep)"/>
    <!-- bright teal to blue facet (runs under the swoosh) -->
    <path d="M40 738L340 795L530 830L600 860L420 960L290 990L40 845Z" fill="url(#teal-blue)"/>
    <!-- swoosh -->
    <path d="M868 530C770 640 650 750 530 830C450 885 370 940 290 984C480 975 760 830 868 690Z" fill="url(#swoosh)"/>
  </g>

